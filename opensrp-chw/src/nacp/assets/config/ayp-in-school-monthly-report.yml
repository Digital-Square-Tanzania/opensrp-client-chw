  - key: "ayp-3-male-10-14"
    grouping: "AYP_IN_SCHOOL"
    description: "Number of adolescent and young people reached with combination minimum defined package"
    indicatorQuery: "WITH monthly_visits AS (
                          SELECT v.visit_id, v.base_entity_id
                          FROM visits v
                          WHERE v.visit_type = 'Ayp In School Client Followup Visit'
                            AND date((substr('%s', 1, 4) || '-' || substr('%s', 6, 2) || '-' || '01')) =
                                        date(substr(strftime('%Y-%m-%d', datetime(v.visit_date / 1000, 'unixepoch', 'localtime')), 1, 4) ||
                                             '-' || substr(strftime('%Y-%m-%d', datetime(v.visit_date / 1000, 'unixepoch', 'localtime')), 6, 2) || '-' || '01')
                      ),
                      cse_clients AS (
                          SELECT DISTINCT mv.base_entity_id
                          FROM monthly_visits mv
                          INNER JOIN visit_details vd ON vd.visit_id = mv.visit_id
                          WHERE vd.visit_key = 'cse_conducted' AND lower(vd.details) = 'yes'
                      ),
                      financial_clients AS (
                          SELECT DISTINCT mv.base_entity_id
                          FROM monthly_visits mv
                          INNER JOIN visit_details vd ON vd.visit_id = mv.visit_id
                          WHERE vd.visit_key = 'financial_literacy_conducted' AND lower(vd.details) = 'yes'
                      ),
                      secondary_clients AS (
                          SELECT DISTINCT mv.base_entity_id
                          FROM monthly_visits mv
                          INNER JOIN visit_details vd ON vd.visit_id = mv.visit_id
                          WHERE (vd.visit_key = 'education_subsidies_provided' AND lower(vd.details) = 'yes')
                             OR (vd.visit_key = 'sanitary_kits_provided' AND lower(vd.details) = 'yes')
                             OR (vd.visit_key = 'screening_for_gbv' AND vd.details IN ('encountered_gbv', 'did_not_encounter_gbv'))
                      ),
                      eligible_clients AS (
                          SELECT DISTINCT c.base_entity_id
                          FROM cse_clients c
                          INNER JOIN financial_clients f ON f.base_entity_id = c.base_entity_id
                          INNER JOIN secondary_clients s ON s.base_entity_id = c.base_entity_id
                      )
                      SELECT count(DISTINCT ec.base_entity_id) as count
                      FROM eligible_clients ec
                      INNER JOIN ec_family_member efm ON efm.base_entity_id = ec.base_entity_id
                      WHERE 10 <= (date('Now') - date(efm.dob))  AND (date('Now') - date(efm.dob)) <= 14
                        AND (lower(efm.gender) = 'male')"

