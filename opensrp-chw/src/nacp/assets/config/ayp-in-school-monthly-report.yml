indicators:
  - key: "ayp-1-male-10-14"
    grouping: "AYP_IN_SCHOOL"
    description: "Number of adolescent and young people Newly enrolled into AYP services"
    indicatorQuery: "SELECT count(DISTINCT enrollment.base_entity_id) as count
                                            FROM ec_ayp_in_school_enrollment enrollment
                                            INNER JOIN ec_family_member efm ON efm.base_entity_id = enrollment.base_entity_id
                                            WHERE 10 <= (date('Now') - date(efm.dob))  AND (date('Now') - date(efm.dob)) <= 14
                                            AND (lower(efm.gender)='male')
                                            AND lower(enrollment.enrollment_status) = 'new_client'
                                            AND date((substr('%s', 1, 4) || '-' || substr('%s', 6, 2) || '-' || '01')) =
                                            date(substr(strftime('%Y-%m-%d', datetime(enrollment.last_interacted_with / 1000, 'unixepoch', 'localtime')), 1, 4) ||
                                            '-' || substr(strftime('%Y-%m-%d', datetime(enrollment.last_interacted_with / 1000, 'unixepoch', 'localtime')), 6, 2) || '-' || '01')"

