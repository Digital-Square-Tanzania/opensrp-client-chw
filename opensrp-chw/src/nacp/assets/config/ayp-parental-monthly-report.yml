                           date(substr(exit.event_date, 1, 4) || '-' || substr(exit.event_date, 6, 2) || '-' || '01')"

  - key: "ayp-parental-4-introduction"
    grouping: "AYP_PARENTAL"
    description: "Parents/guardians reached with the Introduction session"
    indicatorQuery: "SELECT count(DISTINCT services.base_entity_id) as count
                     FROM ec_ayp_parental_services services
                     WHERE lower(services.event_type) = 'parenting training for parents and guardians'
                       AND services.event_date IS NOT NULL
                       AND services.section_selection IS NOT NULL
                       AND lower(services.section_selection) LIKE '%introduction%'
                       AND date((substr('%s', 1, 4) || '-' || substr('%s', 6, 2) || '-' || '01')) =
                           date(substr(services.event_date, 1, 4) || '-' || substr(services.event_date, 6, 2) || '-' || '01')"

  - key: "ayp-parental-4-hiv-module"
    grouping: "AYP_PARENTAL"
    description: "Parents/guardians reached with HIV, STIs, and reproductive health session"
    indicatorQuery: "SELECT count(DISTINCT services.base_entity_id) as count
                     FROM ec_ayp_parental_services services
                     WHERE lower(services.event_type) = 'hiv and aids, stis, viral hepatitis and reproductive health'
                       AND services.event_date IS NOT NULL
                       AND lower(services.rh_provided) = 'yes'
                       AND date((substr('%s', 1, 4) || '-' || substr('%s', 6, 2) || '-' || '01')) =
                           date(substr(services.event_date, 1, 4) || '-' || substr(services.event_date, 6, 2) || '-' || '01')"

