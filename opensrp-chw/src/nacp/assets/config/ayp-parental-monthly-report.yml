indicators:
  - key: "ayp-parental-1-grand-total"
    grouping: "AYP_PARENTAL"
    description: "Number of parents/guardians newly reached with parents’ education programme"
    indicatorQuery: "SELECT count(DISTINCT services.base_entity_id) as count
                     FROM ec_ayp_parental_services services
                     WHERE lower(services.event_type) = 'client_status'
                       AND services.event_date IS NOT NULL
                       AND lower(services.client_status) = 'new_client'
                       AND date((substr('%s', 1, 4) || '-' || substr('%s', 6, 2) || '-' || '01')) =
                           date(substr(services.event_date, 1, 4) || '-' || substr(services.event_date, 6, 2) || '-' || '01')"

  - key: "ayp-parental-1-male"
    grouping: "AYP_PARENTAL"
    description: "Number of male parents/guardians newly reached with parents’ education programme"
    indicatorQuery: "SELECT count(DISTINCT services.base_entity_id) as count
                     FROM ec_ayp_parental_services services
                     INNER JOIN ec_family_member efm ON efm.base_entity_id = services.base_entity_id
                     WHERE lower(services.event_type) = 'client_status'
                       AND services.event_date IS NOT NULL
                       AND lower(services.client_status) = 'new_client'
                       AND lower(efm.gender) = 'male'
                       AND date((substr('%s', 1, 4) || '-' || substr('%s', 6, 2) || '-' || '01')) =
                           date(substr(services.event_date, 1, 4) || '-' || substr(services.event_date, 6, 2) || '-' || '01')"

