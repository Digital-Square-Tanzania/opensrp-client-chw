  - key: "ayp-parental-3-grand-total"
    grouping: "AYP_PARENTAL"
    description: "Number of parents/caregivers who completed parenting sessions"
    indicatorQuery: "SELECT count(DISTINCT exit.base_entity_id) as count
                     FROM ec_ayp_parenting_services_parental_group_exit exit
                     WHERE lower(exit.event_type) = 'parents and guardians’ group exit assessment tool'
                       AND exit.event_date IS NOT NULL
                       AND lower(exit.score_category) = 'ready to operate independently'
                       AND date((substr('%s', 1, 4) || '-' || substr('%s', 6, 2) || '-' || '01')) =
                           date(substr(exit.event_date, 1, 4) || '-' || substr(exit.event_date, 6, 2) || '-' || '01')"

