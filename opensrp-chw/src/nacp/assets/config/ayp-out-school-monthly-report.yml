  - key: "ayp-2-grand-total"
    grouping: "AYP"
    description: "Idadi ya wateja waliopata SBC services (Client + Group)"
    indicatorQuery: "
      SELECT COUNT(DISTINCT combined.client_id) AS count
      FROM (
          SELECT
              eaoscfv.id AS client_id,
              eaoscfv.choose_sbc_health_behavior_change_services_provided,
              eaoscfv.last_interacted_with
          FROM ec_ayp_out_school_client_followup_visits eaoscfv

          UNION ALL

          SELECT
              eaosgfv.member_base_entity_id AS client_id,
              eaosgfv.choose_sbc_health_behavior_change_services_provided,
              eaosgfv.last_interacted_with
          FROM ec_ayp_out_school_group_followup_visits eaosgfv
      ) combined
      INNER JOIN ec_family_member efm
          ON efm.base_entity_id = combined.client_id
      WHERE combined.choose_sbc_health_behavior_change_services_provided IS NOT NULL
        AND date(substr('%s',1,4) || '-' || substr('%s',6,2) || '-01') =
            date(
              substr(strftime('%Y-%m-%d',
                datetime(combined.last_interacted_with / 1000,'unixepoch','localtime')),1,4)
              || '-' ||
              substr(strftime('%Y-%m-%d',
                datetime(combined.last_interacted_with / 1000,'unixepoch','localtime')),6,2)
              || '-01'
            )"
  - key: "ayp-2-female-10-14"
    grouping: "AYP"
    description: "Wanawake umri 10–14"
    indicatorQuery: "
      SELECT COUNT(DISTINCT combined.client_id) AS count
      FROM (
          SELECT id AS client_id, choose_sbc_health_behavior_change_services_provided, last_interacted_with
          FROM ec_ayp_out_school_client_followup_visits
          UNION ALL
          SELECT member_base_entity_id, choose_sbc_health_behavior_change_services_provided, last_interacted_with
          FROM ec_ayp_out_school_group_followup_visits
      ) combined
      INNER JOIN ec_family_member efm ON efm.base_entity_id = combined.client_id
      WHERE efm.gender = 'Female'
        AND (date('now') - date(efm.dob)) > 9
        AND (date('now') - date(efm.dob)) < 15
        AND combined.choose_sbc_health_behavior_change_services_provided IS NOT NULL
        AND date(substr('%s',1,4) || '-' || substr('%s',6,2) || '-01') =
