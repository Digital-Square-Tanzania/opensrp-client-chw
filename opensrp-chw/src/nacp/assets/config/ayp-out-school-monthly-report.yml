indicators:
#Indicator 1
  - key: "enrolled-ayp-total"
    grouping: "AYP"
    description: "Idadi wa wateja wapya waliosajiliwa katika kipindi cha ripoti Umri <10"
    indicatorQuery: " SELECT count(DISTINCT eaose.id) as count FROM ec_ayp_out_school_enrollment eaose
                      INNER JOIN ec_family_member efm ON efm.base_entity_id = eaose.id
                      WHERE date((substr('%s', 1, 4) || '-' || substr('%s', 6, 2) || '-' || '01')) =
                      date(substr(eaose.date_enrolled, 7, 4) || '-' || substr(eaose.date_enrolled, 4, 2) || '-' || '01')"
  - key: "enrolled-ayp-female-10-14"
    grouping: "AYP"
    description: "Idadi wa wateja wapya waliosajiliwa katika kipindi cha ripoti Umri 10-14"
    indicatorQuery: " SELECT count(DISTINCT eaose.id) as count FROM ec_ayp_out_school_enrollment eaose
                      INNER JOIN ec_family_member efm ON efm.base_entity_id = eaose.id
                      WHERE (date('now')-date(efm.dob)) > 9 AND (date('now')-date(efm.dob)) < 15
                      AND (efm.gender='Female')
                      AND date((substr('%s', 1, 4) || '-' || substr('%s', 6, 2) || '-' || '01')) =
