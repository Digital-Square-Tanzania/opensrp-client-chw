indicators:
  - key: "sh-1"
    grouping: "HARM_REDUCTION_SOBER_HOUSE"
    description: "Idadi ya wakazi waliopata huduma katika nyumba ya upataji nafuu katika kipindi cha ripoti"
    indicatorQuery: "SELECT count(DISTINCT ehshs.entity_id) as count
                      FROM ec_harm_reduction_sober_house_services ehshs
                      WHERE date((substr('%s', 1, 4) || '-' || substr('%s', 6, 2) || '-' || '01')) =
                      date(substr(strftime('%Y-%m-%d', datetime(ehshs.last_interacted_with / 1000, 'unixepoch', 'localtime')), 1, 4) ||
                      '-' || substr(strftime('%Y-%m-%d', datetime(ehshs.last_interacted_with / 1000, 'unixepoch', 'localtime')), 6, 2) || '-' || '01')"

  - key: "sh-2"
    grouping: "HARM_REDUCTION_SOBER_HOUSE"
    description: "Kiwango cha elimu cha wakazi waliopata huduma katika nyumba katika kipindi cha ripoti"
    indicatorQuery: "SELECT count(DISTINCT ehshs.entity_id) as count
                      FROM ec_harm_reduction_sober_house_services ehshs
                      INNER JOIN ec_harm_reduction_sober_house_enrollment ehshe
                        ON ehshe.base_entity_id = ehshs.entity_id
                      WHERE trim(ifnull(ehshe.education_level, '')) <> ''
                      AND date((substr('%s', 1, 4) || '-' || substr('%s', 6, 2) || '-' || '01')) =
                      date(substr(strftime('%Y-%m-%d', datetime(ehshs.last_interacted_with / 1000, 'unixepoch', 'localtime')), 1, 4) ||
