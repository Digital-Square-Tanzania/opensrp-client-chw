    description: "Idadi ya wagonjwa walioanzishiwa matibabu ya TB/DR-TB au ukoma na wanaoishi na mgonjwa wa TB au ukoma (ME 15 na zaidi)"
    indicatorQuery: " SELECT count(DISTINCT etcv.base_entity_id) as count FROM ec_tbleprosy_contact_visit etcv 
                                          INNER JOIN ec_family_member efm ON efm.base_entity_id = etcv.base_entity_id
                                          INNER JOIN ec_tbleprosy_screening ets ON ets.base_entity_id = etcv.base_entity_id
                                          INNER JOIN ec_tbleprosy_observation_results etor ON etor.base_entity_id = etcv.base_entity_id
                                          WHERE efm.gender='Male'
                                          AND (etcv.relationship_to_index_client = 'same_household')
                                          AND (etor.tb_sample_test_results = 'pulmonary_tb' OR etor.tb_sample_test_results = 'extra_pulmonary_tb' OR etor.tb_sample_test_results = 'drug_resistant_tb' OR etor.leprosy_investigation_results = 'leprosy_confirmed')
                                          AND (ets.screening_status = 'tb_presumptive' OR ets.screening_status = 'leprosy_presumptive')
                                          AND (etor.tb_treatment_start_date IS NOT NULL OR etor.leprosy_treatment_start_date IS NOT NULL)
                              			  AND date(efm.dob, '+15 years') <= date('now')
                                          AND date((substr('%s', 1, 4) || '-' || substr('%s', 6, 2) || '-' || '01')) = date(substr(strftime('%Y-%m-%d',
                                          datetime(etcv.last_interacted_with / 1000, 'unixepoch', 'localtime')), 1, 4) || '-' || substr(strftime('%Y-%m-%d',
                                          datetime(etcv.last_interacted_with / 1000, 'unixepoch', 'localtime')), 6, 2) || '-' || '01')"

