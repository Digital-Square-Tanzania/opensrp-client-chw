---
name: step1_blood_pressure_diastolic
description: Block submission when diastolic is greater than or equal to systolic
priority: 1
condition: "step1_blood_pressure_diastolic != null && step1_blood_pressure_systolic != null && step1_blood_pressure_diastolic != '' && step1_blood_pressure_systolic != '' && Integer.parseInt(step1_blood_pressure_diastolic) >= Integer.parseInt(step1_blood_pressure_systolic)"
actions:
  - "constraint = 'Diastolic must be less than systolic'"
