---
name: step3_family_history_diabetes
description: Family history diabetes relevance based on the pre-screening questions
priority: 1
condition: "(step1_agree_with_screening_procedure == 'Yes' || step1_agree_with_screening_procedure == 'Ndio') &&
            (step2_diagnosed_diabetes == 'No' || step2_diagnosed_diabetes == 'Hapana') && 
            (step2_medicines_diabetes == 'No' || step2_medicines_diabetes == 'Hapana') && 
            (step2_screened_diabetes_12m == 'No' || step2_screened_diabetes_12m == 'Hapana') && 
            (step2_medicines_hypertension == 'No' || step2_medicines_hypertension == 'Hapana') && 
            (step2_screened_hypertension_last12m == 'No' || step2_screened_hypertension_last12m == 'Hapana') &&
            (step2_routine_clinic_visits == 'No' || step2_routine_clinic_visits == 'Hapana')"
actions:
  - "isRelevant = true"
