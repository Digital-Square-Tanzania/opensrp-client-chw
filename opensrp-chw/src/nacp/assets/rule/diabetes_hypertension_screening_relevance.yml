---
name: step3_diabetes_risk_score_output
description: Risk calculated for diabetes and hypertension screening
priority: 1
condition: "(step3_family_history_diabetes != 'Family history of diabetes?' && 
            step3_age != '' && 
            step3_waist_circumference != '' && 
            step3_systolic_bp != '' && 
            step3_diastolic_bp != '')"
actions:
  - "isRelevant = true"
---
name: step4_client_refused_assessment
description: Risk toaster for diabetes and hypertension screening
priority: 1
condition: "step1_agree_with_screening_procedure == 'No' || step1_agree_with_screening_procedure == 'Hapana'"
actions:
  - "isRelevant = true"

---
name: step4_risk_present_toaster
description: Risk toaster for diabetes and hypertension screening
priority: 1
condition: "(step3_systolic_bp != '' && step3_systolic_bp >= 140) || 
            (step3_diastolic_bp != '' && step3_diastolic_bp >= 90) || 
            (step4_diabetes_risk_score_output != '' && step4_diabetes_risk_score_output > 0.09175944)"
actions:
  - "isRelevant = true"

---
