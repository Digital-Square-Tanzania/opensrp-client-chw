            step2_medicines_diabetes == 'No' && 
            step2_screened_hypertension_12m == 'No' && 
            step2_medicines_hypertension == 'No' && 
            step2_screened_hypertension_last12m == 'No' &&
            step2_routine_clinic_visits == 'No'"
