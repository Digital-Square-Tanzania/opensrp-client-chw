---
name: step1_treatment_provided
description: hps treatment provided
priority: 1
condition: "step1_is_treatment_provided.equalsIgnoreCase('yes')"
actions:
  - "isRelevant = true"
---
name: step1_prompt_for_management_of_blood_pressure
description: Prompt for management of hypertension (high blood pressure) and hypotension (low blood pressure)
priority: 1
condition: "(step1_systolic >= 140) || (step1_diastolic >= 90) || (step1_systolic < 90) || (step1_diastolic < 60)"
actions:
  - "isRelevant = true"
---
name: step1_prompt_for_rbg
description: prompt for random blood sugar
priority: 1
condition: "(Float.parseFloat(step1_blood_sugar_result) <= 7 || Float.parseFloat(step1_blood_sugar_result) >= 11)"
actions:
  - "isRelevant = true"
---
name: step1_diseases_signs_and_symptoms_male
description: validate diseases and symptoms for male
priority: 1
condition: "step1_provision_of_curative_services.equalsIgnoreCase('yes') && global_gender.equalsIgnoreCase('male')"
actions:
  - "isRelevant = true"
---
name: step1_diseases_signs_and_symptoms_female
description: validate diseases and symptoms for female
priority: 1
condition: "step1_provision_of_curative_services.equalsIgnoreCase('yes') && global_gender.equalsIgnoreCase('female')"
actions:
  - "isRelevant = true"
---
name: step1_is_treatment_provided
description: show treatment provided
priority: 1
condition: "step1_malaria_mrdt_result.equalsIgnoreCase('positive_mrdt')
            || step1_diseases_signs_and_symptoms_male.contains('fever')
            || step1_diseases_signs_and_symptoms_female.contains('fever') 
            || step1_diseases_signs_and_symptoms_male.contains('nausea_and_vomiting') 
            || step1_diseases_signs_and_symptoms_female.contains('nausea_and_vomiting')
            || step1_diseases_signs_and_symptoms_male.contains('headache') 
            || step1_diseases_signs_and_symptoms_female.contains('headache') 
            || step1_diseases_signs_and_symptoms_male.contains('diarrhoea') 
            || step1_diseases_signs_and_symptoms_female.contains('diarrhoea') 
            || step1_diseases_signs_and_symptoms_male.contains('body_malaise')
            || step1_diseases_signs_and_symptoms_female.contains('body_malaise')
            || step1_diseases_signs_and_symptoms_male.contains('body_convulsion') 
            || step1_diseases_signs_and_symptoms_female.contains('body_convulsion') 
            || step1_diseases_signs_and_symptoms_male.contains('cough') 
            || step1_diseases_signs_and_symptoms_female.contains('cough') 
            || step1_diseases_signs_and_symptoms_male.contains('body_injury') 
            || step1_diseases_signs_and_symptoms_female.contains('body_injury') 
            || step1_diseases_signs_and_symptoms_male.contains('other_signs_and_symptoms') 
            || step1_diseases_signs_and_symptoms_female.contains('other_signs_and_symptoms')"
actions:
  - "isRelevant = true"
---
name: step1_diseases_signs_and_symptoms
description: hps diseases signs and symptoms
priority: 1
condition: "step1_provision_of_curative_services.equalsIgnoreCase('yes')"
actions:
  - "calculation = if (global_gender.equalsIgnoreCase('male')) { return step1_diseases_signs_and_symptoms_male}
                   else if (global_gender.equalsIgnoreCase('female')) { return step1_diseases_signs_and_symptoms_female}
                   else {return '' }
    "
