---
name: step1_is_disease_test_conducted
description: hps diseases tests conducted
priority: 1
condition: "step1_provision_of_curative_services.equalsIgnoreCase('yes')"
actions:
  - "isRelevant = true"
---
name: step1_specify_signs_and_symptoms_provided
description: hps other education provided
priority: 1
condition: "step1_diseases_signs_and_symptoms_male.contains('other_signs_and_symptoms') || step1_diseases_signs_and_symptoms_female.contains('other_signs_and_symptoms')"
actions:
  - "isRelevant = true"

---
name: step1_systolic
description: hps blood pressure measurement result
priority: 1
condition: "step1_diseases_test_conducted.contains('blood_pressure_measurement')"
actions:
  - "isRelevant = true"

---
name: step1_diastolic
description: hps blood pressure measurement result
priority: 1
condition: "step1_diseases_test_conducted.contains('blood_pressure_measurement')"
actions:
