---
name: step1_year
description: Rule for calculation of the year
priority: 1
condition: "true"
actions:
  - "def getDate(dateFormat) {
        import java.util.*;
        import java.text.SimpleDateFormat;
        return new SimpleDateFormat(dateFormat).format(System.currentTimeMillis());
    }"
  - "calculation = getDate('yyyy')"
