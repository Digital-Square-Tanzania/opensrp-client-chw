---
name: step1_age_calculated
description: Age calculated
priority: 1
condition: "true"
actions:
  - "calculation = (!step1_dob_unknown.isEmpty() && step1_dob_unknown.contains('dob_unknown')) ? step1_age : helper.formatDate(step1_dob,'y')"
---
name: step1_dob
description: dob relevance
priority: 1
condition: "!step1_dob_unknown.contains('dob_unknown')"
actions:
  - "isRelevant = true"
---
name: step1_age
description: age relevance
priority: 1
condition: "step1_dob_unknown.contains('dob_unknown')"
actions:
  - "isRelevant = true"
---
name: step1_cause_of_death_male
description: Rule to control the visibility of (step1_cause_of_death_male)
priority: 1
condition: "step1_sex.equalsIgnoreCase('male') && !step1_dod.equals(step1_dob)"
actions:
  - "isRelevant = true"
---
name: step1_cause_of_death_female
description: Rule to control the visibility of (step1_cause_of_death_female)
priority: 1
condition: "step1_sex.equalsIgnoreCase('female') && (!step1_dod.equals(step1_dob))"
actions:
  - "isRelevant = true"
---
name: step1_cause_of_death_specify
description: Rule to control the visibility of (step1_cause_of_death_specify)
priority: 1
condition: "step1_cause_of_death_female.equalsIgnoreCase('other_reason') ||
            step1_cause_of_death_male.equalsIgnoreCase('other_reason') ||
            step1_cause_of_death_dob_dod.equalsIgnoreCase('other_reason')
            "
actions:
  - "isRelevant = true"
---
name: step1_cause_of_death_dob_dod
description: Rule to control the visibility of (step1_cause_of_death_dob_dod)
priority: 1
condition: "(step1_sex.equalsIgnoreCase('male') || step1_sex.equalsIgnoreCase('female')) && step1_dod.equals(step1_dob)"
actions:
  - "isRelevant = true"
---
name: step1_cause_of_death
description: Rule to calculate the visibility of (step1_cause_of_death)
priority: 1
condition: "true"
actions:
  - "calculation = if (!step1_cause_of_death_male.isEmpty()) { return step1_cause_of_death_male } 
                   else if (!step1_cause_of_death_dob_dod.isEmpty()) { return step1_cause_of_death_dob_dod }
                   else if (!step1_cause_of_death_female.isEmpty()) { return step1_cause_of_death_female }
                   else {return '' }
    "

---
name: step1_dob
description: Ensure Date of Birth (DOB) is before Date of Death (DOD)
priority: 1
condition: "step1_dob > step1_dod"
actions:
  - "isValid = false"
  - "errorMessage = 'Date of Birth must be earlier than Date of Death'"
---
name: step1_dob_validation_toaster
description: Display toaster error message when DOB is greater than or equal to DOD
priority: 1
condition: "step1_dob > step1_dod"
actions:
  - "isRelevant = true"
