---
name: step1_age_calculated
description: Age calculated
priority: 1
condition: "true"
actions:
  - "calculation = (!step1_dob_unknown.isEmpty() && step1_dob_unknown.contains('dob_unknown')) ? step1_age : helper.getDifferenceYears(step1_dod, step1_dob)"
---
name: step1_dob
description: dob relevance
priority: 1
condition: "!step1_dob_unknown.contains('dob_unknown')"
actions:
  - "isRelevant = true"
---
name: step1_age
description: age relevance
priority: 1
condition: "step1_dob_unknown.contains('dob_unknown')"
actions:
  - "isRelevant = true"
---
name: step1_dob_validation_toaster
description: Display toaster error message when DOB is not before DOD
priority: 1
condition: "!step1_dob.isEmpty() && !step1_dod.isEmpty() && step1_dob > step1_dod"
actions:
  - "isRelevant = true"
---
name: step1_cause_of_death_stillbirth
description: Show stillbirth causes for stillbirth records
priority: 1
condition: "!step1_dod.isEmpty() && !step1_dob.isEmpty() && helper.getDifferenceDays(step1_dod, step1_dob) == 0"
actions:
  - "isRelevant = true"
---
name: step1_cause_of_death_female_wra
description: Show maternal causes for female deaths excluding stillbirth
priority: 1
condition: "(step1_dod.isEmpty() || step1_dob.isEmpty() || helper.getDifferenceDays(step1_dod, step1_dob) != 0) && step1_sex.equalsIgnoreCase('female')"
actions:
  - "isRelevant = true"
---
name: step1_cause_of_death_general
description: Show general causes for non-female deaths excluding stillbirth
priority: 1
condition: "(step1_dod.isEmpty() || step1_dob.isEmpty() || helper.getDifferenceDays(step1_dod, step1_dob) != 0) && step1_sex.equalsIgnoreCase('male')"
actions:
  - "isRelevant = true"
---
name: step1_cause_of_death
description: Persist the selected cause from the relevant death cause radio
priority: 1
condition: "true"
actions:
  - "calculation = (!step1_dod.isEmpty() && !step1_dob.isEmpty() && helper.getDifferenceDays(step1_dod, step1_dob) == 0) ? step1_cause_of_death_stillbirth : step1_sex.equalsIgnoreCase('female') ? step1_cause_of_death_female_wra : step1_cause_of_death_general"
---
name: step1_other_cause_of_death
description: Show other cause of death field when 'other' is selected
priority: 1
condition: "((!step1_dod.isEmpty() && !step1_dob.isEmpty() && helper.getDifferenceDays(step1_dod, step1_dob) == 0) && step1_cause_of_death_stillbirth.contains('other')) || (((step1_dod.isEmpty() || step1_dob.isEmpty() || helper.getDifferenceDays(step1_dod, step1_dob) != 0) && step1_sex.equalsIgnoreCase('female')) && step1_cause_of_death_female_wra.contains('other')) || (((step1_dod.isEmpty() || step1_dob.isEmpty() || helper.getDifferenceDays(step1_dod, step1_dob) != 0) && !step1_sex.equalsIgnoreCase('female')) && step1_cause_of_death_general.contains('other'))"
actions:
  - "isRelevant = true"
