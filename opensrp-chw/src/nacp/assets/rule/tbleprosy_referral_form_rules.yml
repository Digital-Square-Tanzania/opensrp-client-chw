---
name: "client_reason_for_referral_visibility"
description: "Show client reasons for referral when client referral type is selected"
priority: 1
condition: "referral_type['client'] != null"
actions:
  - "client_reason_for_referral_visibility = true"
---
name: "sample_reason_for_referral_visibility"
description: "Show sample reasons for referral when sample referral type is selected"
priority: 1
condition: "referral_type['sample'] != null"
actions:
  - "sample_reason_for_referral_visibility = true"
---
name: "problem_other_visibility"
description: "Show other reason text field when Other reasons is selected"
priority: 1
condition: "(referral_type['client'] != null && client_reason_for_referral['Other_reasons'] != null) || (referral_type['sample'] != null && sample_reason_for_referral['Other_reasons'] != null)"
actions:
  - "problem_other_visibility = true"
---
name: "referral_date_calculation"
description: "Referral date calculation"
priority: 1
condition: "true"
actions:
  - "referral_date_calculation = System.currentTimeMillis()"
---
name: "referral_time_calculation"
description: "Referral time calculation"
priority: 1
condition: "true"
actions:
  - "def getDate(dateFormat) {
        import java.util.*;
        import java.text.SimpleDateFormat;
        return new SimpleDateFormat(dateFormat).format(System.currentTimeMillis());
    }"
  - "referral_time_calculation = getDate('HH:mm:ss.SSS')"
---
name: "referral_type_calculation"
description: "Referral type calculation"
priority: 1
condition: "true"
actions:
  - "referral_type_calculation = 'community_to_facility_referral'"
---
name: "referral_status_calculation"
description: "Referral status calculation"
priority: 1
condition: "true"
actions:
  - "referral_status_calculation = 'PENDING'"
---
name: "problem_calculation"
description: "Map client/sample reasons for referral to problem"
priority: 1
condition: "true"
actions:
  - "problem_calculation = (referral_type['client'] != null) ? ((client_reason_for_referral != null && !client_reason_for_referral.isEmpty()) ? client_reason_for_referral : null) : (referral_type['sample'] != null) ? ((sample_reason_for_referral != null && !sample_reason_for_referral.isEmpty()) ? sample_reason_for_referral : null) : null"
