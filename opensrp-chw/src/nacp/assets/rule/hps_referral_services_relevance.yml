---
name: step1_other_method_specify
description: if step1_other_method_specify
priority: 1
condition: "step1_referral_system_including_ucs.contains('other_method') || step1_referral_system_excluding_ucs.contains('other_method')"
actions:
  - "isRelevant = true "
---
name: step1_referral_system_used
description: if step1_referral_system_used
priority: 1
condition: "step1_referral_system.equalsIgnoreCase('yes')"
actions:
  - "isRelevant = true "
---
name: step1_others_referrals_specify
description: if step1_others_referrals_specify
priority: 1
condition: "step1_referral_provided.contains('other_referral_services')"
actions:
  - "isRelevant = true "
---
name: step1_prompt_for_referral_system_used
description: if step1_prompt_for_referral_system_used
priority: 1
condition: "step1_referral_system_including_ucs.contains('ucs')"
actions:
  - "isRelevant = true "
---
name: step1_was_there_any_referral_system_used
description: if step1_referral_provided
priority: 1
condition: "step1_provide_referral_services.contains('yes')"
actions:
  - "isRelevant = true "
---
name: step1_referral_provided_male
description: referral provided for male
priority: 1
condition: "step1_provide_referral_services.equalsIgnoreCase('yes') && global_gender.equalsIgnoreCase('male')"
actions:
  - "isRelevant = true"
---
name: step1_referral_provided_female
description: referral provided for female
priority: 1
condition: "step1_provide_referral_services.equalsIgnoreCase('yes') && global_gender.equalsIgnoreCase('female')"
actions:
  - "isRelevant = true"
---
name: step1_referral_system_including_ucs
description: referral system including ucs
priority: 1
condition: " step1_was_there_any_referral_system_used.contains('yes') 
&& (step1_referral_provided.contains('family_planning') ||
             step1_referral_provided.contains('sexually_transmitted') ||
             step1_referral_provided.contains('male_circumcision') ||
             step1_referral_provided.contains('other_malaria') ||
             step1_referral_provided.contains('anc_services') ||
             step1_referral_provided.contains('pnc_care') ||
             step1_referral_provided.contains('cervical_breast_cancer'))
           "
actions:
  - "isRelevant = true"
---
name: step1_referral_system_excluding_ucs
description: referral system excluding ucs
priority: 1
condition: " step1_was_there_any_referral_system_used.contains('yes') && !(step1_referral_provided.contains('family_planning') ||
             step1_referral_provided.contains('sexually_transmitted') ||
             step1_referral_provided.contains('male_circumcision') ||
             step1_referral_provided.contains('other_malaria') ||
             step1_referral_provided.contains('anc_services') ||
             step1_referral_provided.contains('pnc_care') ||
             step1_referral_provided.contains('cervical_breast_cancer'))
           "
actions:
  - "isRelevant = true"
---
name: step1_referral_system_provided
description: referral system provided
priority: 1
condition: "true"
actions:
    - "calculation = if (step1_was_there_any_referral_system_used.contains('yes') 
                          && (step1_referral_provided.contains('family_planning') ||
                                       step1_referral_provided.contains('sexually_transmitted') ||
                                       step1_referral_provided.contains('male_circumcision') ||
                                       step1_referral_provided.contains('other_malaria') ||
                                       step1_referral_provided.contains('anc_services') ||
                                       step1_referral_provided.contains('pnc_care') ||
                                       step1_referral_provided.contains('cervical_breast_cancer'))) {return step1_referral_system_including_ucs }
                      else if(step1_was_there_any_referral_system_used.contains('yes') && !(step1_referral_provided.contains('family_planning') ||
                                           step1_referral_provided.contains('sexually_transmitted') ||
                                           step1_referral_provided.contains('male_circumcision') ||
                                           step1_referral_provided.contains('other_malaria') ||
                                           step1_referral_provided.contains('anc_services') ||
                                           step1_referral_provided.contains('pnc_care') ||
                                           step1_referral_provided.contains('cervical_breast_cancer'))){
                         return step1_referral_system_excluding_ucs
                      }
                      else {return '' }
      "
---
name: step1_referral_provided
description: hps referrals provided
priority: 1
condition: "true"
actions:
  - "calculation = if (global_gender.equalsIgnoreCase('male')) { return step1_referral_provided_male}
                   else if (global_gender.equalsIgnoreCase('female')) { return step1_referral_provided_female}
                   else {return '' }
    "