---
name: "problem_other_visibility"
description: "Specify other symptoms"
priority: 1
condition: "problem['other_reasons'] != null"
actions:
  - "problem_other_visibility =  true"
---
name: "service_before_referral_calculation"
description: "Service Before Referral"
condition: "true"
priority: 1
actions:
  - "service_before_referral_calculation = 'None'"
---
name: "referral_date_calculation"
description: "Referral date calculation"
priority: 1
condition: "true"
actions:
  - "referral_date_calculation =  System.currentTimeMillis()"
---
name: "referral_time_calculation"
description: "Referral time calculation"
priority: 1
condition: "true"
actions:
  - "def getDate(dateFormat) {
        import java.util.*;
        import java.text.SimpleDateFormat;
        return new SimpleDateFormat(dateFormat).format(System.currentTimeMillis());
    }"
  - "referral_time_calculation = getDate('HH:mm:ss.SSS')"
---
name: "referral_type_calculation"
description: "Referral type calculation"
priority: 1
condition: "true"
actions:
  - "referral_type_calculation = 'community_to_facility_referral'"
---
name: "referral_status_calculation"
description: "Referral type calculation"
priority: 1
condition: "true"
actions:
  - "referral_status_calculation = 'PENDING'"
---
name: "treatment_supporter_name_visibility"
description: "Show treatment supporter name when a caregiver is present"
priority: 1
condition: "has_treatment_supporter == 'Yes'"
actions:
  - "treatment_supporter_name_visibility = true"
---
name: "treatment_supporter_phone_visibility"
description: "Show treatment supporter phone when a caregiver is present"
priority: 1
condition: "has_treatment_supporter == 'Yes'"
actions:
  - "treatment_supporter_phone_visibility = true"
---
name: "treatment_supporter_relationship_visibility"
description: "Show treatment supporter relationship when a caregiver is present"
priority: 1
condition: "has_treatment_supporter == 'Yes'"
actions:
  - "treatment_supporter_relationship_visibility = true"
